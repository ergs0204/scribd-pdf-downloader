<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scribd Preview to PDF</title>
  <style>
    body { width: 330px; margin: 0; padding: 18px; font: 14px/1.45 system-ui, sans-serif; color: #1f2328; }
    h1 { margin: 0 0 6px; font-size: 18px; } p { margin: 7px 0 13px; color: #59636e; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #1f6feb; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    progress { width: 100%; height: 16px; margin-top: 12px; }
    #status { min-height: 42px; margin-top: 8px; padding: 10px; border-radius: 7px; background: #f0f3f6; color: #30363d; overflow-wrap: anywhere; }
    #details { margin-top: 7px; color: #59636e; font-size: 12px; white-space: pre-line; }
    .error { background: #ffebe9 !important; color: #9a1600 !important; }
    .success { background: #dafbe1 !important; color: #116329 !important; }
  </style>
</head>
<body>
  <h1>Scribd Preview to PDF</h1>
  <p>Works on official Scribd pages and embedded previews, including scribdvdownloader.com. It preserves Scribd's selectable text when available.</p>
  <button id="download">Download all pages as PDF</button>
  <progress id="progress" value="0" max="1"></progress>
  <div id="status">Open a Scribd document or preview, then click Download. No scrolling is required.</div>
  <div id="details"></div>
  <script src="popup.js"></script>
</body>
</html>
